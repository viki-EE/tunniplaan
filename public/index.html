<html lang="en" data-theme="dark" data-accent="violet">
<head>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M18 40V24l14-8 14 8v16M26 44V32h12v12' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#090b12;--panel:rgba(22,27,43,.74);--panel-s:#161b2b;--panel2:#1d2438;--line:#2a3150;
  --text:#eaedf8;--mute:#8f98b8;--acc:#7c5cff;--acc2:#22d3ee;--now:#ff4d6d;--ok:#34d399;--warn:#fbbf24;
  --r:18px;--shadow:0 10px 40px rgba(0,0,0,.35);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
:root[data-theme=light]{--bg:#f3f4fb;--panel:rgba(255,255,255,.82);--panel-s:#fff;--panel2:#eef0f9;--line:#dcdff0;--text:#151829;--mute:#667094;--shadow:0 10px 30px rgba(40,50,100,.12)}
:root[data-accent=blue]{--acc:#3b82f6;--acc2:#06b6d4}
:root[data-accent=emerald]{--acc:#10b981;--acc2:#84cc16}
:root[data-accent=rose]{--acc:#f43f5e;--acc2:#f59e0b}
:root[data-accent=amber]{--acc:#f59e0b;--acc2:#ef4444}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{min-height:100vh;background:
  radial-gradient(900px 520px at 8% -8%,color-mix(in srgb,var(--acc) 22%,transparent),transparent 60%),
  radial-gradient(800px 520px at 100% 0%,color-mix(in srgb,var(--acc2) 16%,transparent),transparent 55%),var(--bg);
  background-attachment:fixed;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a.lk{cursor:pointer;border-bottom:1px dotted color-mix(in srgb,var(--mute) 60%,transparent)}
a.lk:hover{color:var(--acc2);border-bottom-color:var(--acc2)}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px 90px}

/* header */
.top{position:sticky;top:0;z-index:30;margin:0 -16px;padding:12px 16px;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 70%,transparent);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.top-in{max-width:1200px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand svg{width:38px;height:38px;flex:none;filter:drop-shadow(0 6px 14px color-mix(in srgb,var(--acc) 50%,transparent))}
.brand b{display:block;font-size:18px;letter-spacing:-.02em;line-height:1.1;white-space:nowrap}
.brand small{display:block;color:var(--mute);font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.sp{flex:1}
.search{position:relative;flex:1 1 260px;max-width:480px;min-width:200px}
.search input{width:100%;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--panel-s);padding:0 44px 0 40px;outline:none;transition:.15s}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
.search svg{position:absolute;left:13px;top:12px;opacity:.55;pointer-events:none}
.search kbd{position:absolute;right:10px;top:10px;font:600 11px inherit;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.results{position:absolute;z-index:40;top:48px;left:0;right:0;background:var(--panel-s);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:400px;overflow:auto;padding:6px;display:none}
.results.open{display:block}
.results .grp{padding:8px 10px 4px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.results button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;padding:9px 10px;border-radius:10px}
.results button:hover,.results button.sel{background:var(--panel2)}
.results .nm{color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:40px;height:40px;border-radius:12px;background:var(--panel-s);border:1px solid var(--line);display:grid;place-items:center;font-size:16px;transition:.15s;flex:none}
.ib:hover{border-color:var(--acc);transform:translateY(-1px)}
.ib.on{color:var(--warn);border-color:var(--warn)}

.tag{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;padding:3px 8px;border-radius:7px;background:var(--panel2);color:var(--mute);white-space:nowrap}
.tag.class{color:var(--acc2)}.tag.teacher{color:var(--warn)}.tag.room{color:var(--ok)}.tag.subject{color:#f472b6}

/* favourites */
.favs{display:flex;gap:8px;overflow:auto;padding:14px 2px 4px;scrollbar-width:none}
.favs::-webkit-scrollbar{display:none}
.fav{padding:7px 13px;border-radius:99px;background:var(--panel-s);border:1px solid var(--line);font-weight:650;font-size:13.5px;white-space:nowrap;display:flex;gap:7px;align-items:center}
.fav:hover{border-color:var(--acc)}
.fav.on{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff}
.fav i{font-style:normal;font-size:10px;opacity:.7;font-weight:700}

/* hero */
.hero{display:grid;grid-template-columns:1fr 1.15fr;gap:14px;margin:14px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;backdrop-filter:blur(8px);box-shadow:var(--shadow);animation:rise .35s both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.title .row{display:flex;gap:8px;align-items:center}
.title h1{margin:10px 0 4px;font-size:32px;letter-spacing:-.035em;line-height:1.1;word-break:break-word}
.title .sub{color:var(--mute);font-size:14px}
.title .ib{width:36px;height:36px;font-size:15px}
.now{position:relative;overflow:hidden;background:
  linear-gradient(135deg,color-mix(in srgb,var(--acc) 26%,transparent),color-mix(in srgb,var(--acc2) 12%,transparent)),var(--panel)}
.now .lbl{font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--now);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--now)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.now .big{font-size:26px;font-weight:780;letter-spacing:-.025em;margin:7px 0 3px}
.now .meta{color:var(--mute);font-size:14px;line-height:1.5}
.bar{height:7px;border-radius:99px;background:color-mix(in srgb,var(--text) 12%,transparent);margin-top:14px;overflow:hidden}
.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .6s}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pill{font-size:12.5px;font-weight:650;padding:5px 11px;border-radius:99px;background:color-mix(in srgb,var(--text) 9%,transparent);color:var(--text)}

/* tabs */
.tabs{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 14px}
.seg{display:flex;background:var(--panel-s);border:1px solid var(--line);border-radius:13px;padding:3px;gap:2px;overflow:auto;scrollbar-width:none}
.seg button{padding:8px 15px;border-radius:10px;color:var(--mute);font-weight:650;font-size:14px;white-space:nowrap;transition:.15s}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.days{display:flex;gap:6px;overflow:auto;scrollbar-width:none}
.days button{padding:9px 15px;border-radius:12px;background:var(--panel-s);border:1px solid var(--line);font-weight:650;font-size:14px;color:var(--mute);white-space:nowrap}
.days button.on{color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;box-shadow:0 6px 20px color-mix(in srgb,var(--acc) 40%,transparent)}
.days button.today:not(.on){color:var(--text);border-color:var(--acc)}

/* day view */
.summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.list{display:grid;gap:10px}
.lesson{display:grid;grid-template-columns:82px 1fr auto;gap:14px;align-items:center;padding:15px 17px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c);animation:rise .3s both;transition:.15s}
.lesson:hover{transform:translateX(3px)}
.lesson.live{border-color:var(--now);border-left-color:var(--now);box-shadow:0 0 0 3px color-mix(in srgb,var(--now) 18%,transparent)}
.lesson.past{opacity:.5}
.lesson .t{font-variant-numeric:tabular-nums;font-weight:750;font-size:16px}
.lesson .t small{display:block;color:var(--mute);font-weight:500;font-size:12px;margin-top:2px}
.lesson .n{font-weight:750;font-size:17px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lesson .m{color:var(--mute);font-size:13.5px;margin-top:3px;line-height:1.5}
.x2{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:color-mix(in srgb,var(--c) 28%,transparent)}
.rooms{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.room{font-weight:800;font-size:15px;padding:8px 13px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);min-width:54px;text-align:center;cursor:pointer;transition:.15s}
.room:hover{border-color:var(--ok);color:var(--ok)}
.gap{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:12.5px;padding:0 8px;font-weight:600}
.gap:before,.gap:after{content:"";height:1px;background:var(--line);flex:1}
.gap.win{color:var(--ok)}
.empty{padding:56px 20px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:var(--r);font-size:15px}

/* week grid */
.gridwrap{overflow:auto;padding-bottom:6px}
.grid{display:grid;grid-template-columns:70px repeat(5,minmax(160px,1fr));gap:6px;min-width:900px}
.grid .h{padding:11px;text-align:center;font-weight:750;color:var(--mute);font-size:13px;border-radius:12px;background:var(--panel-s);border:1px solid var(--line)}
.grid .h.today{color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent}
.grid .p{display:flex;flex-direction:column;justify-content:center;align-items:center;color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.grid .p b{color:var(--text);font-size:16px}
.cell{min-height:74px;border-radius:13px;background:var(--panel);border:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:5px}
.cell.todaycol{background:color-mix(in srgb,var(--acc) 7%,var(--panel))}
.cell.nowcell{box-shadow:0 0 0 2px var(--now)}
.chip{border-radius:10px;padding:7px 9px;background:color-mix(in srgb,var(--c) 22%,var(--panel-s));border-left:4px solid var(--c);font-size:12.5px;line-height:1.35}
.chip b{display:block;font-size:13.5px}
.chip span{color:var(--mute)}
.chip.cont{opacity:.45;font-size:11.5px;background:transparent;border-left-style:dashed}
.compact .cell{min-height:52px;padding:4px}.compact .chip{padding:4px 7px}.compact .chip span{display:none}

/* live */
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.sel,.txt{height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel-s);padding:0 12px;outline:none}
.sel:focus,.txt:focus{border-color:var(--acc)}
.btn{height:40px;padding:0 16px;border-radius:12px;background:var(--panel-s);border:1px solid var(--line);font-weight:650;font-size:14px}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff}
.btn.on{border-color:var(--ok);color:var(--ok)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tile{padding:13px 15px;border-radius:15px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c,var(--line));cursor:pointer;transition:.15s;text-align:left;display:block;width:100%;animation:rise .3s both}
.tile:hover{transform:translateY(-2px);border-color:var(--acc)}
.tile.free{--c:var(--ok);opacity:.85}
.tile b{font-size:15.5px}
.tile .s{display:block;margin-top:5px;font-size:13px;color:var(--mute);line-height:1.4}
.tile .fr{color:var(--ok);font-weight:700}

/* stats */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kpi{padding:14px 16px;border-radius:15px;background:var(--panel);border:1px solid var(--line)}
.kpi b{display:block;font-size:26px;letter-spacing:-.03em}
.kpi span{color:var(--mute);font-size:12.5px;font-weight:600}
h2{font-size:12.5px;color:var(--mute);margin:0 0 12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.barrow{display:grid;grid-template-columns:84px 1fr 30px;gap:10px;align-items:center;margin:9px 0;font-size:13.5px}
.track{height:12px;border-radius:99px;background:color-mix(in srgb,var(--text) 9%,transparent);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--c,linear-gradient(90deg,var(--acc),var(--acc2)));transition:width .6s}
.barrow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute)}
.barrow b{text-align:right}
table.ft{width:100%;border-collapse:collapse;font-size:14px}
table.ft td,table.ft th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
table.ft th{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.06em}

/* meet */
.mchips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.mchip{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 12px;border-radius:99px;background:var(--panel-s);border:1px solid var(--line);font-weight:650;font-size:13.5px}
.mchip button{width:22px;height:22px;border-radius:50%;background:var(--panel2);font-size:12px}
.mchip button:hover{background:var(--now);color:#fff}
.cell.m-all{background:color-mix(in srgb,var(--ok) 20%,var(--panel));border-color:var(--ok)}
.cell.m-some{background:color-mix(in srgb,var(--warn) 12%,var(--panel))}
.cell.m-none{background:color-mix(in srgb,var(--now) 12%,var(--panel))}
.cell .mc{margin:auto;text-align:center;font-weight:800;font-size:13px}
.cell .mc small{display:block;font-weight:500;color:var(--mute);font-size:11.5px;margin-top:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:12.5px;margin:12px 0}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:6px;vertical-align:-1px}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:60;background:rgba(5,7,14,.6);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--panel-s);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow);animation:rise .25s both}
.sheet h3{margin:0 0 16px;font-size:20px;letter-spacing:-.02em;display:flex;justify-content:space-between;align-items:center}
.opt{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.opt:last-of-type{border-bottom:0}
.opt small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.swatches{display:flex;gap:8px}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent}
.sw.on{border-color:var(--text)}
.sw[data-v=violet]{background:linear-gradient(135deg,#7c5cff,#22d3ee)}
.sw[data-v=blue]{background:linear-gradient(135deg,#3b82f6,#06b6d4)}
.sw[data-v=emerald]{background:linear-gradient(135deg,#10b981,#84cc16)}
.sw[data-v=rose]{background:linear-gradient(135deg,#f43f5e,#f59e0b)}
.sw[data-v=amber]{background:linear-gradient(135deg,#f59e0b,#ef4444)}
.switch{width:46px;height:26px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);position:relative;transition:.2s;flex:none}
.switch:after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--mute);transition:.2s}
.switch.on{background:var(--acc);border-color:var(--acc)}
.switch.on:after{left:22px;background:#fff}
.keys{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:14px}
kbd.k{font:700 12px inherit;border:1px solid var(--line);border-bottom-width:2px;border-radius:7px;padding:3px 8px;background:var(--panel2);text-align:center;min-width:28px;display:inline-block}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--panel-s);border:1px solid var(--line);padding:11px 18px;border-radius:14px;box-shadow:var(--shadow);font-weight:650;opacity:0;pointer-events:none;transition:.25s;z-index:80}
.toast.show{opacity:1;transform:translate(-50%,0)}
.banner{margin:14px 0 0;padding:11px 16px;border-radius:14px;background:color-mix(in srgb,var(--warn) 14%,var(--panel-s));border:1px solid var(--warn);font-size:13.5px}
.err{padding:22px;border-radius:var(--r);background:color-mix(in srgb,var(--now) 10%,var(--panel-s));border:1px solid var(--now);margin-top:18px;line-height:1.6}
.err code{background:var(--panel2);padding:2px 6px;border-radius:6px}
.skel{height:130px;border-radius:var(--r);background:linear-gradient(90deg,var(--panel) 25%,var(--panel2) 50%,var(--panel) 75%);background-size:200% 100%;animation:sh 1.3s infinite;margin-top:14px}
@keyframes sh{to{background-position:-200% 0}}
.foot{margin-top:34px;color:var(--mute);font-size:12.5px;text-align:center;line-height:1.7}

@media(max-width:820px){.hero{grid-template-columns:1fr}.brand small{display:none}.title h1{font-size:26px}}
@media(max-width:640px){.lesson{grid-template-columns:64px 1fr;padding:13px}.lesson .rooms{grid-column:2;justify-content:flex-start}.search kbd{display:none}.brand b{font-size:16px}}
@media print{
  body{background:#fff;color:#000}.top,.favs,.tabs,.foot,.ib,.banner,.hero .now{display:none!important}
  :root,:root[data-theme=dark]{--panel:#fff;--panel-s:#fff;--panel2:#f2f2f2;--line:#bbb;--text:#000;--mute:#444}
  .card,.cell,.lesson,.chip{box-shadow:none!important;backdrop-filter:none!important;animation:none!important}
  .grid{min-width:0}.gridwrap{overflow:visible}
}
/* ---- v3 ---- */
.par{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:10px}
.par .lesson{border-left-style:solid}
.dr{display:flex!important;gap:8px;align-items:center;padding:5px 0;font-size:13.5px;border-top:1px dashed color-mix(in srgb,var(--line) 60%,transparent)}
.dh2 + .dr{border-top:0}
.dr .hs{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute)}
.dr .tt{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.dr .tt i{font-style:normal;font-size:10px}
.strip{position:relative;height:10px;border-radius:99px;background:color-mix(in srgb,var(--text) 8%,transparent);margin-top:14px;overflow:hidden}
.strip span{position:absolute;top:0;bottom:0;background:var(--c);border-right:2px solid var(--panel-s)}
.strip span.done{opacity:.35}
.strip .nowm{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--now);border-radius:2px}
.stripl{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:4px;font-variant-numeric:tabular-nums}

/* ============ search ============ */
function attachSearch(input, box, onPick) {
  let hits = [], cur = 0;
  const row = (e, i) => `<button data-i="${i}" class="${i === cur ? 'sel' : ''}"><span class="tag ${e.type}">${esc(t('type_' + e.type))}</span><b>${esc(ename(e))}</b><span class="nm">${e.type === 'teacher' ? esc(e.short) : (e.name !== e.short ? esc(e.name) : '')}</span></button>`;
  function run() {
    const q = fold(input.value.trim());
    let html = '';
    if (!q) {
      const favs = S.favs.map((f) => entOf(f.type, f.id)).filter(Boolean);
      const rec = S.recent.map((f) => entOf(f.type, f.id)).filter(Boolean).filter((e) => !favs.some((f) => sameEnt(f, e))).slice(0, 5);
      const cls = DATA.classes.map((c) => ({ type: 'class', ...c })).filter((c) => !favs.some((f) => sameEnt(f, c)) && !rec.some((f) => sameEnt(f, c))).slice(0, 24);
      hits = [...favs, ...rec, ...cls];
      let i = 0;
      const sec = (label, arr) => arr.length ? `<div class="grp">${esc(label)}</div>` + arr.map((e) => row(e, i++)).join('') : '';
      html = sec(t('favs_h'), favs) + sec(t('recent_h'), rec) + sec(t('all_classes'), cls);
    } else {
      const sc = (e) => (fold(e.short) === q ? 0 : fold(e.name).startsWith(q) || fold(e.short).startsWith(q) ? 1 : 2);
      hits = ENTS.filter((e) => e._s.includes(q)).sort((a, b) => sc(a) - sc(b) || TYPES.indexOf(a.type) - TYPES.indexOf(b.type)).slice(0, 50);
      html = hits.map(row).join('');
    }
    cur = 0;
    box.innerHTML = html || `<div style="padding:12px;color:var(--mute)">${esc(t('none'))}</div>`;
    box.classList.add('open');
  }
  const choose = (e) => { box.classList.remove('open'); input.value = ''; input.blur(); onPick(e); };
  input.addEventListener('input', run);
  input.addEventListener('focus', run);
  input.addEventListener('keydown', (ev) => {
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
      ev.preventDefault(); if (!hits.length) return;
      cur = (cur + (ev.key === 'ArrowDown' ? 1 : -1) + hits.length) % hits.length;
      $$('button', box).forEach((b, i) => b.classList.toggle('sel', i === cur));
      const s = $('.sel', box); s && s.scrollIntoView && s.scrollIntoView({ block: 'nearest' });
    } else if (ev.key === 'Enter' && hits[cur]) { ev.preventDefault(); choose(hits[cur]); }
    else if (ev.key === 'Escape') { box.classList.remove('open'); input.blur(); }
  });
  box.addEventListener('click', (ev) => { const b = ev.target.closest('button[data-i]'); if (b && hits[+b.dataset.i]) choose(hits[+b.dataset.i]); });
  document.addEventListener('click', (ev) => { if (input.isConnected && !input.parentElement.contains(ev.target)) box.classList.remove('open'); });
}

function buildICS(e, ls) {

  const tx = (s) => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
  const out = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Oismae Timetable//EN', 'CALSCALE:GREGORIAN', `X-WR-CALNAME:${tx(ename(e) + ' · Õismäe')}`];
  ls.forEach((l, i) => {

    const rooms = l.r.map((id) => IDX.room[id] && IDX.room[id].short).filter(Boolean).join(', ');

      ...(rooms ? [`LOCATION:${tx(rooms)}`] : []), `DESCRIPTION:${tx([teachers, classes].filter(Boolean).join(' · '))}`, 'END:VEVENT');
  });
  out.push('END:VCALENDAR');

}
